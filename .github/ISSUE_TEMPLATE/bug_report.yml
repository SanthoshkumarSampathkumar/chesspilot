name: Bug report
description: Report a reproducible ChessPilot issue
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include API keys, tokens, personal screen captures, or private game data.
        Redact sensitive information before sharing logs or screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open… 2. Select… 3. Observe…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running ChessPilot?
      options:
        - GitHub Pages demo
        - Local development server
        - Other static host
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted console or app message
      description: Remove tokens, API keys, personal data, and private position details.
      render: text
